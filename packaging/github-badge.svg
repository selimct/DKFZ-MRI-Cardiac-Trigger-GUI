<svg xmlns="http://www.w3.org/2000/svg" width="91" height="20" viewBox="0 0 91 20" role="img" aria-label="Trigger GUI">
  <title>Trigger GUI</title>
  <defs>
    <linearGradient id="iconbg" x1="2.44" y1="1.69" x2="17.56" y2="18.31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27a6a1"/>
      <stop offset="1" stop-color="#16496f"/>
    </linearGradient>
    <linearGradient id="labelbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <clipPath id="badgeclip">
      <rect width="91" height="20" rx="3"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeclip)">
    <rect width="20" height="20" fill="#ffffff"/>
    <rect x="20" width="71" height="20" fill="url(#labelbg)"/>

    <!-- Trigger GUI icon, reproduced from the supplied 96x96 SVG -->
    <g transform="scale(0.2083333333)">
      <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#iconbg)"/>
      <rect x="20" y="28" width="56" height="40" rx="6" fill="#f5fbff"/>
      <path d="m29 40 9 8-9 8"
            fill="none" stroke="#16496f" stroke-linecap="round"
            stroke-linejoin="round" stroke-width="4.5"/>
      <path d="M45 56h20"
            fill="none" stroke="#27a6a1" stroke-linecap="round"
            stroke-width="4.5"/>
      <circle cx="68" cy="37" r="2.6" fill="#ef6b5a"/>
    </g>

    <text x="55.5" y="14"
          text-anchor="middle"
          font-family="Verdana,DejaVu Sans,sans-serif"
          font-size="11"
          fill="#fff">Trigger GUI</text>
  </g>
</svg>
